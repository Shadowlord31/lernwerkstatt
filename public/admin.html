<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernwerkstatt – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .module-block { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; margin: 10px 0; background: #fafbfd; }
  .row { display: flex; gap: 10px; align-items: center; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  a.link { color: var(--brand); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <main class="app">
    <h1><i class="mdi mdi-cog"></i> Lernwerkstatt – Admin</h1>

    <div class="card">
      <h2>Kinder</h2>
      <ul id="childrenList" class="plain"></ul>
      <div class="row" style="margin-top:10px">
        <input id="newChildName" type="text" placeholder="Name des Kindes">
        <button onclick="addChild()">Hinzufügen</button>
      </div>
    </div>

    <div class="card">
      <h2>Neues Aufgabenblatt</h2>
      <label>Titel</label>
      <input id="wsTitle" type="text" placeholder="z.B. 9er-Reihe Übung">

      <label>Kind</label>
      <select id="wsChild"></select>

      <label>Fach</label>
      <select id="wsSubject">
        <option value="mathe">Mathe</option>
        <option value="deutsch" disabled>Deutsch (bald verfügbar)</option>
      </select>

      <h3>Module</h3>
      <div id="moduleList"></div>
      <div class="row">
        <select id="addModuleType"></select>
        <button class="secondary" onclick="addModule()">+ Modul hinzufügen</button>
      </div>

      <div style="margin-top:12px">
        <button onclick="saveWorksheet()"><i class="mdi mdi-content-save"></i> Aufgabenblatt speichern</button>
      </div>
    </div>

    <div class="card">
      <h2>Bestehende Aufgabenblätter</h2>
      <ul id="worksheetList" class="plain"></ul>
    </div>
  </main>

<script src="/app.js"></script>
<script>
let moduleTypes = [];
let moduleInstances = [];

async function loadChildren() {
  const children = await api('/api/children');
  const list = document.getElementById('childrenList');
  list.innerHTML = children.map(c => `<li><span>${avatarHtmlSmall(c)} ${c.name}</span></li>`).join('') || '<li>Noch keine Kinder angelegt</li>';
  const select = document.getElementById('wsChild');
  select.innerHTML = '<option value="">– kein Kind zugeordnet –</option>' +
    children.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function avatarHtmlSmall(c) {
  return `<i class="mdi mdi-account-circle" style="color:var(--brand)"></i>`;
}

async function addChild() {
  const name = document.getElementById('newChildName').value.trim();
  if (!name) return;
  await api('/api/children', { method: 'POST', body: JSON.stringify({ name }) });
  document.getElementById('newChildName').value = '';
  loadChildren();
}

async function loadModuleTypes() {
  moduleTypes = await api('/api/module-types');
  const select = document.getElementById('addModuleType');
  select.innerHTML = moduleTypes.map(m => `<option value="${m.key}">${m.label}</option>`).join('');
}

function addModule() {
  const type = document.getElementById('addModuleType').value;
  const modType = moduleTypes.find(m => m.key === type);
  const config = {};
  modType.configFields.forEach(f => { config[f.key] = f.default; });
  moduleInstances.push({ type, config, modType });
  renderModules();
}

function removeModule(idx) {
  moduleInstances.splice(idx, 1);
  renderModules();
}

function renderModules() {
  const container = document.getElementById('moduleList');
  container.innerHTML = moduleInstances.map((inst, idx) => `
    <div class="module-block">
      <div class="row">
        <strong>${inst.modType.label}</strong>
        <button class="danger" onclick="removeModule(${idx})">Entfernen</button>
      </div>
      ${inst.modType.configFields.map(f => `
        <label>${f.label}</label>
        ${f.type === 'select'
          ? `<select onchange="updateConfig(${idx}, '${f.key}', this.value)">
              ${f.options.map(o => `<option value="${o}" ${inst.config[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>`
          : `<input type="number" value="${inst.config[f.key]}" onchange="updateConfig(${idx}, '${f.key}', this.value)">`
        }
      `).join('')}
    </div>
  `).join('');
}

function updateConfig(idx, key, value) {
  moduleInstances[idx].config[key] = isNaN(value) || value === '' ? value : Number(value);
}

async function saveWorksheet() {
  const title = document.getElementById('wsTitle').value.trim();
  const child_id = document.getElementById('wsChild').value || null;
  const subject = document.getElementById('wsSubject').value;

  if (!title) { toast('Bitte einen Titel eingeben'); return; }
  if (moduleInstances.length === 0) { toast('Bitte mindestens ein Modul hinzufügen'); return; }

  try {
    await api('/api/worksheets', {
      method: 'POST',
      body: JSON.stringify({
        title, subject, child_id,
        modules: moduleInstances.map(m => ({ type: m.type, config: m.config })),
      }),
    });
    document.getElementById('wsTitle').value = '';
    moduleInstances = [];
    renderModules();
    loadWorksheets();
    toast('Aufgabenblatt gespeichert!');
  } catch (err) {
    toast('Fehler: ' + err.message);
  }
}

async function loadWorksheets() {
  const worksheets = await api('/api/worksheets');
  const list = document.getElementById('worksheetList');
  list.innerHTML = worksheets.map(w => `
    <li>
      <span>${w.title} ${w.child_name ? '(' + w.child_name + ')' : ''}</span>
      <span>
        <a class="link" href="/worksheet.html?id=${w.id}" target="_blank">Öffnen</a> ·
        <a class="link" href="/api/worksheets/${w.id}/pdf" target="_blank">PDF</a>
      </span>
    </li>
  `).join('') || '<li>Noch keine Aufgabenblätter</li>';
}

loadChildren();
loadModuleTypes();
loadWorksheets();
</script>
</body>
</html>

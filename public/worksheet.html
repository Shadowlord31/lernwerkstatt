<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernwerkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="child-page">
  <main class="app child-app">
    <header class="child-header">
      <button class="secondary" onclick="history.back()"><i class="mdi mdi-arrow-left"></i> Zurück</button>
      <h2 id="title">Lade...</h2>
    </header>
    <div id="content"></div>
  </main>

<script src="/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

const moduleMeta = {
  'reihen-drill': { title: 'Reihen-Drill', icon: 'numeric', color: 'section-blue' },
  'zahlenmauer': { title: 'Zahlenmauer', icon: 'triangle-outline', color: 'section-green' },
  'kreise-ein-und-rechne': { title: 'Kreise ein und rechne', icon: 'circle-multiple-outline', color: 'section-yellow' },
};

async function load() {
  const ws = await api('/api/worksheets/' + id);
  document.querySelector('#title').textContent = ws.title;
  const container = document.querySelector('#content');
  container.innerHTML = '';

  ws.modules.forEach((mod) => {
    const meta = moduleMeta[mod.type] || { title: mod.type };
    const section = document.createElement('div');
    section.className = 'task-section';
    section.innerHTML = `<div class="section-bar"><i class="mdi mdi-${meta.icon || 'star'}"></i> ${meta.title}</div>`;

    const taskWrap = document.createElement('div');
    taskWrap.className = 'task-grid';
    taskWrap.id = 'mod-' + mod.id;

    if (mod.type === 'reihen-drill') renderReihenDrill(taskWrap, mod);
    else if (mod.type === 'zahlenmauer') renderZahlenmauer(taskWrap, mod);
    else if (mod.type === 'kreise-ein-und-rechne') renderKreise(taskWrap, mod);

    section.appendChild(taskWrap);

    const btn = document.createElement('button');
    btn.style.marginTop = '10px';
    btn.innerHTML = '<i class="mdi mdi-check-bold"></i> Prüfen';
    btn.onclick = () => checkModule(mod);
    section.appendChild(btn);

    container.appendChild(section);
  });
}

function renderReihenDrill(container, mod) {
  mod.tasks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'child-task-card';
    div.innerHTML = `<span>${t.display} = </span><input type="number" data-idx="${i}">`;
    container.appendChild(div);
  });
}

function renderZahlenmauer(container, mod) {
  mod.tasks.forEach((t, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'child-task-card';
    const pyramid = document.createElement('div');
    pyramid.className = 'pyramid';
    [2, 1, 0].forEach((level) => {
      const row = document.createElement('div');
      row.className = 'prow';
      t.cells.filter(c => c.level === level).forEach((c, pos) => {
        const cell = document.createElement('div');
        cell.className = 'pcell';
        if (c.given) {
          cell.textContent = c.value;
        } else {
          cell.innerHTML = `<input type="number" data-idx="${i}" data-level="${level}" data-pos="${pos}">`;
        }
        row.appendChild(cell);
      });
      pyramid.appendChild(row);
    });
    wrap.appendChild(pyramid);
    container.appendChild(wrap);
  });
}

function renderKreise(container, mod) {
  mod.tasks.forEach((t, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'child-task-card';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = 'flex-start';

    const dotGroups = document.createElement('div');
    dotGroups.className = 'dot-groups';
    for (let g = 0; g < t.anzahlGruppen; g++) {
      const group = document.createElement('div');
      group.className = 'dot-group';
      for (let d = 0; d < t.gruppengroesse; d++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        group.appendChild(dot);
      }
      dotGroups.appendChild(group);
    }
    wrap.appendChild(dotGroups);
    wrap.innerHTML += `
      <div>${t.gesamt} : ${t.gruppengroesse} = <input type="number" data-idx="${i}" data-field="hauptantwort"></div>
      <div><input type="number" data-idx="${i}" data-field="umkehrantwort"> · ${t.gruppengroesse} = ${t.gesamt} <span class="muted" style="font-size:14px">(Umkehraufgabe)</span></div>
    `;
    container.appendChild(wrap);
  });
}

async function checkModule(mod) {
  const container = document.getElementById('mod-' + mod.id);
  let answers = [];

  if (mod.type === 'reihen-drill') {
    answers = mod.tasks.map((_, i) => container.querySelector(`input[data-idx="${i}"]`).value);
  } else if (mod.type === 'zahlenmauer') {
    answers = mod.tasks.map((t, i) => {
      const inputs = container.querySelectorAll(`input[data-idx="${i}"]`);
      return Array.from(inputs).map(inp => inp.value);
    });
  } else if (mod.type === 'kreise-ein-und-rechne') {
    answers = mod.tasks.map((_, i) => ({
      hauptantwort: container.querySelector(`input[data-idx="${i}"][data-field="hauptantwort"]`).value,
      umkehrantwort: container.querySelector(`input[data-idx="${i}"][data-field="umkehrantwort"]`).value,
    }));
  }

  const { results } = await api(`/api/worksheet-modules/${mod.id}/check`, {
    method: 'POST',
    body: JSON.stringify({ answers }),
  });

  results.forEach((r) => {
    container.querySelectorAll(`input[data-idx="${r.index}"]`).forEach((inp) => {
      inp.classList.remove('correct', 'wrong');
      inp.classList.add(r.correct ? 'correct' : 'wrong');
    });
  });
}

load().catch((err) => toast(err.message));
</script>
</body>
</html>
